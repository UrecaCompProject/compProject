# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: ko-KR
early_access: false

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!node_modules/**'
    - '!dist/**'
    - '!package-lock.json'
    - '!public/**'
    - '!**/*.svg'
  tools:
    eslint:
      enabled: true

chat:
  auto_reply: true
